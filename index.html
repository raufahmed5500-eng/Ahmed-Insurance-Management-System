<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIMS - Ahmed Insurance Management System</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url('https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .calculator-container {
            max-width: 800px;
            margin: 30px auto;
            background-color: rgba(255, 255, 255, 0.96);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }

        .popup-header { border-bottom: 2px solid #25d366; padding-bottom: 15px; margin-bottom: 25px; }
        .welcome-msg { font-size: 0.9rem; color: #25d366; font-weight: bold; text-transform: uppercase; }
        .popup-header h2 { margin: 5px 0 0 0; font-size: 1.8rem; color: #111b21; }

        .mini-calc-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        .mini-calc-table th { background-color: #f0f2f5; padding: 12px; border: 1px solid #e9edef; text-align: center; font-size: 0.85rem; }
        .mini-calc-table td { padding: 10px; border: 1px solid #e9edef; }
        .mini-calc-table input { width: 100%; padding: 10px; border: 1px solid #ced1d3; border-radius: 6px; text-align: center; }

        .input-field { border: 2px solid #25d366 !important; font-weight: bold; }
        .readonly-input { background-color: #f8f9fa; font-weight: bold; }

        /* 📥 PDF Button Styling */
        .btn-pdf {
            width: 100%;
            padding: 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-bottom: 25px;
            transition: 0.3s;
        }
        .btn-pdf:hover { background-color: #0056b3; }

        .history-section { border-top: 2px dashed #ced1d3; padding-top: 20px; }
        .search-box { width: 100%; padding: 10px; margin-bottom: 10px; border: 2px solid #ced1d3; border-radius: 30px; }
        .history-container { max-height: 250px; overflow-y: auto; background: #f8f9fa; border: 1px solid #e9edef; border-radius: 8px; }
        .history-table { width: 100%; border-collapse: collapse; text-align: center; }
        .history-table th { background: #eaeaea; padding: 10px; position: sticky; top: 0; }
        .history-table td { padding: 10px; border-bottom: 1px solid #e9edef; }
        .highlight-row { background-color: #d1f7dd !important; font-weight: bold; }
    </style>
</head>
<body>

<div class="calculator-container">
    <div class="popup-header">
        <p class="welcome-msg">Welcome 👋</p>
        <h2>Ahmed Insurance Management System (AIMS)</h2>
    </div>
    
    <table class="mini-calc-table">
        <thead><tr><th>%PER</th><th>GROSS</th><th>VAT</th></tr></thead>
        <tbody><tr>
            <td><input type="number" id="per" class="input-field" value="16"></td>
            <td><input type="number" id="gross" class="input-field" value="4242"></td>
            <td><input type="text" id="vat" class="readonly-input" readonly></td>
        </tr></tbody>
        <thead><tr><th>PREMIUM</th><th>COMISSIO</th><th>NET</th></tr></thead>
        <tbody><tr>
            <td><input type="text" id="premium" class="readonly-input" readonly></td>
            <td><input type="text" id="commission" class="readonly-input" readonly></td>
            <td><input type="text" id="net" class="readonly-input" readonly></td>
        </tr></tbody>
    </table>

    <button class="btn-pdf" onclick="generatePDF()">📥 Download PDF Report</button>

    <div class="history-section">
        <h3>Calculation History Ledger</h3>
        <input type="text" id="historySearch" class="search-box" placeholder="🔍 Search Gross or NET..." oninput="renderHistory()">
        <div class="history-container">
            <table class="history-table">
                <thead><tr><th>%</th><th>Gross</th><th>Premium</th><th>Net</th></tr></thead>
                <tbody id="historyLogBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const perInput = document.getElementById('per');
    const grossInput = document.getElementById('gross');
    const vatInput = document.getElementById('vat');
    const premiumInput = document.getElementById('premium');
    const commissionInput = document.getElementById('commission');
    const netInput = document.getElementById('net');
    const historyLogBody = document.getElementById('historyLogBody');
    const searchInput = document.getElementById('historySearch');

    let historyArray = JSON.parse(localStorage.getItem('calcHistoryData')) || [];

    // PDF Generator Function
    function generatePDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        
        doc.setFontSize(18);
        doc.text("AIMS Insurance Report", 70, 20);
        doc.setFontSize(12);
        doc.text("------------------------------------------", 20, 30);
        doc.text("Gross Amount: " + grossInput.value, 20, 40);
        doc.text("VAT (5%): " + vatInput.value, 20, 50);
        doc.text("Premium: " + premiumInput.value, 20, 60);
        doc.text("Net Payable: " + netInput.value, 20, 70);
        doc.text("------------------------------------------", 20, 80);
        doc.text("Generated by AIMS System", 20, 90);
        
        doc.save("AIMS_Insurance_Report.pdf");
    }

    function calculate(isInitial = false) {
        const per = parseFloat(perInput.value) || 0;
        const gross = parseFloat(grossInput.value) || 0;
        const vat = gross * (5 / 105);
        const premium = gross - vat;
        const commission = premium * (per / 100);
        const net = gross - commission; 

        vatInput.value = vat.toFixed(2);
        premiumInput.value = premium.toFixed(2);
        commissionInput.value = commission.toFixed(2);
        netInput.value = Math.round(net); 

        if (isInitial) addToHistoryLog(per, gross, premium.toFixed(2), Math.round(net));
    }

    function addToHistoryLog(per, gross, premium, net) {
        if (gross === 0) return;
        historyArray.unshift({ per, gross, premium, net });
        if (historyArray.length > 100) historyArray.pop();
        localStorage.setItem('calcHistoryData', JSON.stringify(historyArray));
        renderHistory();
    }

    function renderHistory() {
        const filterText = searchInput.value.trim();
        historyLogBody.innerHTML = '';
        historyArray.forEach(item => {
            const isMatch = filterText !== "" && (item.gross.toString().includes(filterText) || item.net.toString().includes(filterText));
            historyLogBody.innerHTML += `<tr class="${isMatch ? 'highlight-row' : ''}">
                <td>${item.per}%</td><td>${item.gross}</td><td>${item.premium}</td><td><b>${item.net}</b></td>
            </tr>`;
        });
    }

    perInput.addEventListener('input', () => calculate(false));
    grossInput.addEventListener('input', () => calculate(false));
    calculate(true);
    renderHistory();
</script>

</body>
</html>
